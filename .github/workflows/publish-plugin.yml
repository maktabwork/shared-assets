# Publishes the Claude Code plugin (mo@monjizeen) to the private
# maktabwork/plugins repo whenever its parts change on main. Account managers read
# only that repo. Pushes over SSH with a deploy key: the secret
# PLUGINS_DEPLOY_KEY holds the private key of a write deploy key on
# maktabwork/plugins (nothing else).
name: Publish plugin

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'plugin/**'
      - 'docs/CLAUDE-CODE-PLUGIN.md'
      - 'scripts/build-plugin.sh'
      - '.github/workflows/publish-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.PLUGINS_DEPLOY_KEY != '' }}
    steps:
      - name: Skip until maktabwork/plugins is set up
        if: env.HAS_KEY != 'true'
        run: echo "::notice::PLUGINS_DEPLOY_KEY is not set yet, so the plugin was not published. See docs/CLAUDE-CODE-PLUGIN.md."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      # Plain git over SSH, not actions/checkout: checkout cannot clone an
      # empty repo, which maktabwork/plugins is before its first publish.
      - name: Clone maktabwork/plugins with the deploy key
        if: env.HAS_KEY == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.PLUGINS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/plugins_deploy_key
          chmod 600 ~/.ssh/plugins_deploy_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/plugins_deploy_key -o IdentitiesOnly=yes"
          git clone git@github.com:maktabwork/plugins.git plugins-repo
          git -C plugins-repo config core.sshCommand "$GIT_SSH_COMMAND"

      - name: Build the plugin
        if: env.HAS_KEY == 'true'
        run: scripts/build-plugin.sh plugins-repo "0.1.${{ github.run_number }}"

      - name: Push if anything changed
        if: env.HAS_KEY == 'true'
        working-directory: plugins-repo
        run: |
          git config user.name "monjizeen-bot"
          git config user.email "bot@monjizeen.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Publish plugin 0.1.${{ github.run_number }} from shared-assets@${GITHUB_SHA::7}"
          git push origin HEAD:main
